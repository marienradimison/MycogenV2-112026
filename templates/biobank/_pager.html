{% if page.paginator.num_pages > 1 %}
<nav class="mt-2 d-flex align-items-center gap-2 small" aria-label="Pages">
  {% if page.has_previous %}<a class="btn btn-sm btn-light" href="?{{ querystring }}&page={{ page.previous_page_number }}">‹ Précédente</a>{% endif %}
  <span class="text-muted">Page {{ page.number }} / {{ page.paginator.num_pages }} · {{ page.paginator.count }} ligne{{ page.paginator.count|pluralize }}</span>
  {% if page.has_next %}<a class="btn btn-sm btn-light" href="?{{ querystring }}&page={{ page.next_page_number }}">Suivante ›</a>{% endif %}
</nav>
{% endif %}
