{% extends "base.html" %}
{% block title %}{{ module.label }}{% endblock %}
{% block content %}
<div class="page-title">
  <div class="icon"><i class="bi {{ module.icon }}"></i></div>
  <h1>{{ module.label }}</h1>
</div>
<div class="row g-3">
  {% for i in module.items %}
  <div class="col-sm-6 col-xl-4 col-xxl-3">
    <a class="card module-tile h-100" href="{{ i.url }}">
      <div class="card-body d-flex gap-3 align-items-start">
        <span class="tile-icon"><i class="bi {{ i.icon }}"></i></span>
        <div><div class="fw-semibold">{{ i.label }}</div><div class="small text-muted">{{ i.desc }}</div></div>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
