{% extends "base.html" %}
{% block title %}Changer le mot de passe{% endblock %}
{% block content %}
<div class="page-title"><div class="icon"><i class="bi bi-key"></i></div><h1>Changer le mot de passe</h1></div>
<div class="card" style="max-width:520px"><div class="card-body">
  <form method="post">{% csrf_token %}
    {% for field in form %}
      <div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        <input class="form-control" type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}" required>
        {{ field.errors }}{% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}</div>
    {% endfor %}
    <button class="btn btn-primary">Enregistrer</button>
  </form>
</div></div>
{% endblock %}
